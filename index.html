:root{color-scheme:dark;font-family:"Yu Gothic",Meiryo,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f9edda;background:radial-gradient(circle at 50% 0,#4a2b68 0,#1a112e 48%,#0a0918 100%);padding:24px 14px}.shell{max-width:560px;margin:auto;border:1px solid #8b6da7;border-radius:26px;background:#1d1532dd;padding:25px 19px 22px;box-shadow:0 20px 65px #0007;text-align:center}.top{color:#e9c782;letter-spacing:.25em;font-size:24px}h1{font:700 clamp(28px,7vw,39px) Georgia,serif;color:#efcb80;margin:8px 0}.sub{color:#cdbbd9;margin:0 0 25px}.label{display:block;margin-bottom:12px;font-weight:700}.topics{display:flex;gap:8px;margin-bottom:22px}.topics button{flex:1;border:1px solid #72568f;border-radius:12px;background:#302347;color:#f4e8ff;padding:12px 4px;cursor:pointer;font-size:14px}.topics button.active{background:#6e4e92;border-color:#e6c279}.tarot{position:relative;width:206px;height:318px;margin:0 auto 22px;border-radius:16px;padding:8px;background:linear-gradient(135deg,#f2d69a,#8e652e,#e7c17d);box-shadow:0 0 35px #c39b6055;transition:transform .4s}.tarot.reveal{animation:flip .65s ease}@keyframes flip{0%{transform:rotateY(90deg);opacity:.4}100%{transform:rotateY(0);opacity:1}}.inner{position:relative;width:100%;height:100%;overflow:hidden;border-radius:10px;border:1px solid #d9b56b;background:radial-gradient(ellipse at center,#4b3276,#201433 75%);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:17px 9px}.inner:before{content:"";position:absolute;inset:8px;border:1px solid #d8b77466;border-radius:80px 80px 9px 9px;pointer-events:none}.stars{font-size:18px;color:#d7b56c;letter-spacing:.3em}.sigil{width:136px;height:145px;display:grid;place-items:center;border:1px solid #d8b7748c;border-radius:50%;background:radial-gradient(circle,#69438d88,transparent 68%);position:relative}.sigil:before,.sigil:after{content:"";position:absolute;inset:12px;border:1px solid #e5c7817d;transform:rotate(45deg)}.sigil:after{inset:27px;transform:rotate(0deg);border-radius:50%}.glyph{z-index:1;color:#f0cf88;font-size:67px;line-height:1;font-family:Georgia,"Segoe UI Symbol",serif;text-shadow:0 0 16px #e9bf75a0}.card-id{font:12px Georgia,serif;color:#f0cf88;letter-spacing:.13em}.card-name{font-size:14px;color:#f8e8c9;font-weight:bold}.tarot.reversed .card-art{transform:rotate(180deg)}.card-art{display:block;width:100%;height:100%;object-fit:contain;transition:transform .35s ease}.tarot.has-art{background:none;border:0;padding:0;box-shadow:0 0 38px #c39b6055}.tarot.has-art .inner{display:none}.tarot.has-art .card-art{display:block}.card-art{display:none}[hidden]{display:none!important}.card-caption{color:#e7d5ee;font-size:13px;margin:-8px 0 18px;min-height:1.5em}.primary{width:100%;max-width:330px;border:0;border-radius:13px;padding:15px 18px;background:linear-gradient(90deg,#c09450,#f2d591);color:#26152d;font-size:16px;font-weight:700;cursor:pointer}.primary:active{transform:scale(.99)}.result{margin-top:24px;padding:19px;text-align:left;background:#2a1d43;border:1px solid #8b6da7;border-radius:17px;line-height:1.9}.result h2{text-align:center;color:#f1d08c;font-size:21px;margin:0}.orient{text-align:center;color:#d3b4ed;margin:3px 0 12px}.meaning{color:#f2d48e;font-weight:700}.hint{font-size:13px;color:#c6b7d2;margin-top:12px}.foot{font-size:12px;color:#bbaeca;line-height:1.8;margin:23px 0 0}[hidden]{display:none!important}@media(max-width:360px){.shell{padding:19px 12px}.topics button{font-size:12px}}

</style></head><body><main class="shell"><div class="top" aria-hidden="true">☾ ✦ ☽</div><h1>Mystic Oracle</h1><p class="sub">月夜のタロット — 大アルカナ22枚</p><span class="label">占いたいテーマを選んでください</span><div class="topics" role="group" aria-label="占いのテーマ"><button type="button" data-topic="general" class="active" aria-pressed="true">総合運</button><button type="button" data-topic="love" aria-pressed="false">恋愛運</button><button type="button" data-topic="work" aria-pressed="false">仕事運</button></div><div class="stage" id="stage"><div class="deck" id="deck" aria-hidden="true"><div class="deck-card">☾</div><div class="deck-card">✧</div><div class="deck-card">☽</div></div><div class="tarot" id="tarot" aria-label="タロットカード"><div class="inner"><div class="stars">✦ ✧ ✦</div><div class="sigil"><span class="glyph" id="glyph">☽</span></div><div><div class="card-id" id="cardId">MYSTIC ORACLE</div><div class="card-name" id="cardName">月の扉</div></div></div><img class="card-art" id="cardArt" alt="" width="220" height="340" hidden></div></div><p class="card-caption" id="cardCaption">月の扉の向こうに、あなたのカードが待っています</p><p class="status" id="status" role="status" aria-live="polite">心を落ち着けて、カードを引いてください</p><button class="primary" type="button" id="draw">✦ カードを1枚引く</button><section class="result" id="result" aria-live="polite" hidden><h2 id="name"></h2><p class="orient" id="orientation"></p><div class="meaning" id="meaning"></div><p id="message"></p><p class="hint" id="hint"></p></section><section class="history" id="history" aria-label="鑑定履歴"><h2>☾ 鑑定履歴</h2><p class="storage-note" id="storageNote">鑑定結果はこのブラウザ内に保存されます。ブラウザのデータを削除すると履歴も消えます。</p><div class="history-actions"><button class="secondary" type="button" id="clearHistory">履歴をすべて削除</button></div><div id="historyList" class="history-list"></div><div id="historyDetail" class="history-detail" hidden></div></section><p class="foot">Ver.0.5 ｜ 大アルカナ22枚のオリジナルイラストを使用。<br>この占いは娯楽・自己理解のためのものです。未来や結果を保証しません。</p></main><script>
const cards=[{"number":0,"name":"愚者","en":"THE FOOL","symbol":"✧","up":"自由・出発・好奇心","rev":"無計画・ためらい","messages":{"general":"新しい体験に心を開き、最初の一歩を楽しんで。","love":"飾らない自分で相手と向き合って。","work":"小さな挑戦が次の可能性につながります。"}},{"number":1,"name":"魔術師","en":"THE MAGICIAN","symbol":"✦","up":"創造・行動・才能","rev":"準備不足・空回り","messages":{"general":"今ある道具と知恵を生かしてみましょう。","love":"気持ちを言葉にして伝えてみて。","work":"アイデアを具体的な行動に変えるとき。"}},{"number":2,"name":"女教皇","en":"THE HIGH PRIESTESS","symbol":"☾","up":"直感・静けさ・洞察","rev":"思い込み・閉鎖性","messages":{"general":"静かな時間に本音を確かめましょう。","love":"言葉にならない気持ちにも耳を傾けて。","work":"情報を見極め、慎重に判断しましょう。"}},{"number":3,"name":"女帝","en":"THE EMPRESS","symbol":"❀","up":"豊かさ・育み・美","rev":"甘え・過保護","messages":{"general":"自分をいたわり、豊かさを受け取って。","love":"優しさを自然な形で表現して。","work":"成果を育てるための環境を整えて。"}},{"number":4,"name":"皇帝","en":"THE EMPEROR","symbol":"♜","up":"安定・責任・秩序","rev":"頑固・支配","messages":{"general":"大切なことに優先順位をつけましょう。","love":"安心できる関係の土台を作って。","work":"計画を立て、着実に進めましょう。"}},{"number":5,"name":"教皇","en":"THE HIEROPHANT","symbol":"⚜","up":"学び・信頼・伝統","rev":"形式主義・依存","messages":{"general":"信頼できる助言に学びがありそう。","love":"共通の価値観を話し合って。","work":"経験者の知恵を取り入れましょう。"}},{"number":6,"name":"恋人","en":"THE LOVERS","symbol":"♡","up":"調和・選択・絆","rev":"迷い・すれ違い","messages":{"general":"自分の価値観に沿う選択を。","love":"心地よい対話を大切にして。","work":"協力相手との相性を見直して。"}},{"number":7,"name":"戦車","en":"THE CHARIOT","symbol":"➶","up":"前進・意志・突破","rev":"焦り・暴走","messages":{"general":"方向を定めて一歩ずつ進もう。","love":"勢いだけでなく相手の歩幅も大切に。","work":"目標を絞ると力が発揮できます。"}},{"number":8,"name":"力","en":"STRENGTH","symbol":"∞","up":"勇気・忍耐・優しさ","rev":"自信不足・消耗","messages":{"general":"穏やかな強さを信じて。","love":"相手を変えるより理解を深めて。","work":"粘り強さが成果を支えます。"}},{"number":9,"name":"隠者","en":"THE HERMIT","symbol":"✺","up":"探究・内省・知恵","rev":"孤立・考えすぎ","messages":{"general":"一人の時間から答えを探して。","love":"距離を置いて気持ちを整理しても大丈夫。","work":"深く調べる時間が役立ちます。"}},{"number":10,"name":"運命の輪","en":"WHEEL OF FORTUNE","symbol":"◉","up":"転機・循環・機会","rev":"停滞・流れへの抵抗","messages":{"general":"変化の兆しを柔軟に受け止めて。","love":"予想外の出会いや会話を楽しんで。","work":"状況の変化に合わせて計画を調整して。"}},{"number":11,"name":"正義","en":"JUSTICE","symbol":"⚖","up":"公平・均衡・決断","rev":"偏り・不均衡","messages":{"general":"事実を見つめて判断しましょう。","love":"お互いの立場を尊重して。","work":"条件や役割を明確にすると安心です。"}},{"number":12,"name":"吊るされた男","en":"THE HANGED MAN","symbol":"◇","up":"視点の転換・受容","rev":"停滞感・自己犠牲","messages":{"general":"いつもと違う角度から眺めて。","love":"結論を急がず相手の事情を考えて。","work":"いったん立ち止まることも前進です。"}},{"number":13,"name":"死神","en":"DEATH","symbol":"✢","up":"終わりと再生・変容","rev":"変化への恐れ・執着","messages":{"general":"手放すことで新しい余白が生まれます。","love":"古い思い込みを見直す好機です。","work":"役目を終えた方法を更新して。"}},{"number":14,"name":"節制","en":"TEMPERANCE","symbol":"⚗","up":"調和・節度・回復","rev":"極端・不調和","messages":{"general":"無理のないペースを取り戻して。","love":"歩み寄れる中間点を探して。","work":"仕事量と休息のバランスを整えて。"}},{"number":15,"name":"悪魔","en":"THE DEVIL","symbol":"⛓","up":"欲望・束縛・執着","rev":"依存からの解放・気づき","messages":{"general":"自分を縛る習慣を見つめ直して。","love":"無理に合わせていないか確認して。","work":"目先の誘惑と長期目標を比べて。"}},{"number":16,"name":"塔","en":"THE TOWER","symbol":"⚡","up":"衝撃・刷新・真実","rev":"変化への抵抗・緊張","messages":{"general":"想定外の出来事にも落ち着いて対応を。","love":"本音を話す前に気持ちを整えて。","work":"計画の弱点を見直す機会です。"}},{"number":17,"name":"星","en":"THE STAR","symbol":"✩","up":"希望・回復・ひらめき","rev":"自信の揺らぎ・焦り","messages":{"general":"小さな希望を大切にしましょう。","love":"素直な気持ちを伝える機会を探して。","work":"新しい発想を記録しておきましょう。"}},{"number":18,"name":"月","en":"THE MOON","symbol":"☽","up":"直感・夢・曖昧さ","rev":"不安の整理・誤解","messages":{"general":"答えを急がず気持ちを整理して。","love":"相手の気持ちを決めつけず対話を。","work":"曖昧な点を確認してから進めて。"}},{"number":19,"name":"太陽","en":"THE SUN","symbol":"☼","up":"喜び・活力・成功","rev":"一時的な停滞・期待の調整","messages":{"general":"身近な喜びに目を向けて。","love":"自然体の笑顔を大切に。","work":"これまでの成果を振り返って。"}},{"number":20,"name":"審判","en":"JUDGEMENT","symbol":"♬","up":"目覚め・再評価・再出発","rev":"後悔・決断の先送り","messages":{"general":"過去の経験を次の一歩に生かして。","love":"伝えそびれた思いを整理して。","work":"以前の案を見直す価値がありそう。"}},{"number":21,"name":"世界","en":"THE WORLD","symbol":"◎","up":"完成・統合・達成","rev":"未完成・区切りの難しさ","messages":{"general":"ここまでの歩みを認めて。","love":"互いの成長を喜び合って。","work":"一つの区切りをつけ、次を描いて。"}}];
const cardImages=["00_fool.png", "01_magician.png", "02_high_priestess.png", "03_empress.png", "04_emperor.png", "05_hierophant.png", "06_lovers.png", "07_chariot.png", "08_strength.png", "09_hermit.png", "10_wheel_of_fortune.png", "11_justice.png", "12_hanged_man.png", "13_death.png", "14_temperance.png", "15_devil.png", "16_tower.png", "17_star.png", "18_moon.png", "19_sun.png", "20_judgement.png", "21_world.png"];
let topic='general';const $=id=>document.getElementById(id);
document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{topic=button.dataset.topic;document.querySelectorAll('[data-topic]').forEach(b=>{let active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});}));
let busy=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const STORAGE_KEY='mystic_oracle_history_v05';
const MAX_HISTORY=100;
let historyEntries=[];let storageAvailable=true;
const topicLabels={general:'総合運',love:'恋愛運',work:'仕事運'};
function readHistory(){try{const raw=localStorage.getItem(STORAGE_KEY);const parsed=raw?JSON.parse(raw):[];historyEntries=Array.isArray(parsed)?parsed.filter(x=>x&&Number.isInteger(x.number)&&x.number>=0&&x.number<22&&typeof x.date==='string'&&typeof x.topic==='string'&&typeof x.reversed==='boolean').slice(0,MAX_HISTORY):[];}catch(e){storageAvailable=false;historyEntries=[];showStorageWarning();}}
function showStorageWarning(){$('storageNote').textContent='このブラウザでは履歴を保存できません。占いは引き続き利用できます。';}
function persistHistory(){if(!storageAvailable)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(historyEntries));}catch(e){storageAvailable=false;showStorageWarning();}}
function addHistory(c,reversed,selectedTopic){const entry={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),date:new Date().toISOString(),number:c.number,reversed,topic:selectedTopic,message:c.messages[selectedTopic]};historyEntries.unshift(entry);historyEntries=historyEntries.slice(0,MAX_HISTORY);persistHistory();renderHistory();}
function makeEl(tag,cls,content){const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.textContent=content;return el;}
function dateLabel(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'日時不明':d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function renderHistory(){const list=$('historyList');list.replaceChildren();if(!historyEntries.length){list.append(makeEl('p','history-empty','まだ鑑定履歴はありません。カードを引くとここに記録されます。'));$('historyDetail').hidden=true;return;}
 historyEntries.forEach(entry=>{const c=cards[entry.number];const item=makeEl('div','history-item');const img=makeEl('img','history-thumb');img.src='images/'+cardImages[entry.number];img.alt=c.name+'のカード';img.loading='lazy';if(entry.reversed)img.style.transform='rotate(180deg)';const info=makeEl('div','history-info');info.append(makeEl('div','history-date',dateLabel(entry.date)),makeEl('div','history-name',c.name+'・'+(entry.reversed?'逆位置':'正位置')),makeEl('div','history-topic',topicLabels[entry.topic]||'総合運'));const btn=makeEl('button','secondary','詳細');btn.type='button';btn.addEventListener('click',()=>showHistoryDetail(entry.id));item.append(img,info,btn);list.append(item);});}
function showHistoryDetail(id){const entry=historyEntries.find(x=>x.id===id);if(!entry)return;const c=cards[entry.number],detail=$('historyDetail');detail.replaceChildren();const heading=makeEl('h3','',c.name+' / '+c.en);const dt=makeEl('p','',dateLabel(entry.date)+' ｜ '+(topicLabels[entry.topic]||'総合運')+' ｜ '+(entry.reversed?'逆位置':'正位置'));const img=makeEl('img',entry.reversed?'reversed-img':'');img.src='images/'+cardImages[entry.number];img.alt=c.name+'のカード';const keywords=makeEl('p','', 'キーワード：'+(entry.reversed?c.rev:c.up));const msg=makeEl('p','',entry.message||c.messages[entry.topic]||'');const close=makeEl('button','secondary','詳細を閉じる');close.type='button';close.addEventListener('click',()=>{detail.hidden=true;});const del=makeEl('button','secondary','この履歴を削除');del.type='button';del.addEventListener('click',()=>{if(!confirm('この鑑定履歴を削除しますか？'))return;historyEntries=historyEntries.filter(x=>x.id!==id);persistHistory();renderHistory();});detail.append(heading,dt,img,keywords,msg,close,document.createTextNode(' '),del);detail.hidden=false;detail.scrollIntoView({behavior:'smooth',block:'nearest'});}
$('clearHistory').addEventListener('click',()=>{if(!historyEntries.length)return;if(!confirm('すべての鑑定履歴を削除しますか？この操作は取り消せません。'))return;historyEntries=[];persistHistory();renderHistory();});
readHistory();renderHistory();
function showReading(c,reversed){
 const frame=$('tarot'); frame.classList.toggle('reversed',reversed);
 $('glyph').textContent=c.symbol;
 const art=$('cardArt');art.src='images/'+cardImages[c.number];art.alt=c.name+'（'+c.en+'）のタロットカード・'+(reversed?'逆位置':'正位置');art.hidden=false;
 frame.classList.add('has-art');
 $('cardCaption').textContent='第'+c.number+'番 '+c.name+' — '+(reversed?'逆位置':'正位置');
 $('cardId').textContent=String(c.number).padStart(2,'0')+' · '+c.en;$('cardName').textContent=c.name;
 $('name').textContent=c.name+' / '+c.en;$('orientation').textContent=reversed?'☾ 逆位置':'✦ 正位置';
 $('meaning').textContent='キーワード：'+(reversed?c.rev:c.up);
 $('message').textContent=c.messages[topic];
 $('hint').textContent=reversed?'逆位置のヒント：焦らず、いま必要な見直しや調整を意識してみましょう。':'正位置のヒント：カードが示す強みを、今日の小さな行動につなげてみましょう。';
 $('result').hidden=false;
}
$('draw').addEventListener('click',async()=>{
 if(busy)return;busy=true;const button=$('draw'),stage=$('stage'),frame=$('tarot');
 button.disabled=true;$('result').hidden=true;frame.classList.remove('arriving','turning');
 const c=cards[Math.floor(Math.random()*cards.length)],reversed=Math.random()<.5;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 $('status').textContent='✧ カードをシャッフルしています…';button.textContent='シャッフル中…';stage.classList.add('shuffling');
 await wait(reduced?100:1300);
 $('status').textContent='✦ あなたのカードを選びました';button.textContent='カードをめくっています…';
 stage.classList.remove('shuffling');frame.classList.add('turning');
 await wait(reduced?50:380);
 showReading(c,reversed);addHistory(c,reversed,topic);frame.classList.remove('turning');frame.classList.add('arriving');
 await wait(reduced?50:550);
 $('status').textContent='✦ カードがあなたにメッセージを届けました';
 button.textContent='✦ もう一度カードを引く';button.disabled=false;busy=false;
});
